apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-app
  labels:
    app: reviews-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reviews-app
  template:
    metadata:
      labels:
        app: reviews-app
    spec:
      containers:
        - name: reviews-container
          image: reviews-svc-s01:latest
          ports:
            - containerPort: 8169
          livenessProbe:
            httpGet:
              path: /health
              port: 8169
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8169
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
